<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JAMB Quiz</title>
    <link rel="stylesheet" href="../style/quiz.css">

    <!-- PERMANENT SOLO MODE SCREEN SWITCH GUARD -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const joined = JSON.parse(localStorage.getItem('joinedQuiz')) || {};
            const isSolo = joined.isSolo === true || 
                           joined.is_solo === true || 
                           joined.mode === 'solo' || 
                           (joined.quizId && String(joined.quizId).startsWith('solo_'));

            if (isSolo) {
                const waitingRoom = document.getElementById('waiting-room');
                const quizContent = document.getElementById('quiz-content');
                if (waitingRoom) waitingRoom.style.display = 'none';
                if (quizContent) quizContent.style.display = 'block';
            }
        });
    </script>
</head>

<body>

    <div class="quiz-container">

        <!-- WAITING ROOM -->
        <div id="waiting-room" class="waiting-room">
            <div class="waiting-icon">⏳</div>
            <h1>Waiting for Quiz to Start</h1>
            <p id="waiting-student-name">Student</p>
            <p class="waiting-message">
                You have successfully joined the quiz.<br>
                Please wait for the creator to start the quiz.
            </p>
            <div class="waiting-loader">Waiting...</div>
        </div>

        <!-- QUIZ CONTENT -->
        <div id="quiz-content" style="display: none;">

            <!-- Quiz Header -->
            <div class="quiz-header">
                <div>
                    <h1>JAMB QUIZ</h1>
                    <p id="student-name"></p>
                </div>

                <div class="timer">
                    <span>Time Left</span>
                    <strong id="timer">02:00:00</strong>
                </div>
            </div>

            <!-- SUBJECT NAVIGATION -->
            <div class="subject-navigation-wrapper">
                <h3>Subjects</h3>
                <div id="subject-navigation" class="subject-navigation">
                    <!-- Subjects generated by JavaScript -->
                </div>
            </div>

            <!-- QUESTION PALETTE / NAVIGATION GRID -->
            <div class="palette-wrapper">
                <h3>Question Palette</h3>
                <div id="question-palette" class="question-palette">
                    <!-- Question Number Palette Buttons Generated by JS -->
                </div>
            </div>

            <!-- SUBJECT AND QUESTION INFO -->
            <div class="quiz-info">
                <p id="subject-name">Use of English</p>
                <p id="question-number">Question 1 of 60</p>
            </div>

            <!-- QUESTION BOX -->
            <div class="question-box">
                <h2 id="question">Question will appear here</h2>
                <div id="options-container">
                    <!-- Options generated by JavaScript -->
                </div>
            </div>

            <!-- NAVIGATION BUTTONS -->
            <div class="quiz-buttons">
                <button id="previous-button">← Previous</button>
                <button id="next-button">Next →</button>
            </div>

            <!-- SUBMIT -->
            <button id="submit-button">Submit Quiz</button>

        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="../script/question.js"></script>
    <script type="module" src="../script/quiz.js"></script>

</body>

</html>

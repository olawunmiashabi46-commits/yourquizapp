<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Force desktop-style scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SMART REDIRECT FOR LOGGED-IN USERS -->
    <script>
      (function() {
        const loggedInStudent = localStorage.getItem("loggedInStudent");
        // If logged in and NOT coming directly from the dashboard setup button, send to dashboard
        const isComingFromDashboard = document.referrer.includes("dashboard.html");

        if (loggedInStudent && !isComingFromDashboard) {
          window.location.replace("dashboard.html");
        }
      })();
    </script>

    <title>JAMB Quiz</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>

    <div class="container">
        <div class="welcome-box">

            <h1>JAMB QUIZ</h1>
            <p class="subtitle">
                Select your category and choose your 4 JAMB subjects.
            </p>

            <!-- STUDENT -->
            <div class="form-group">
                <label>Student</label>
                <p id="student-display">Loading student...</p>
            </div>

            <!-- CATEGORY -->
            <div class="form-group">
                <label for="category">Select Your Category</label>
                <select id="category">
                    <option value="science">Science</option>
                    <option value="commercial">Commercial</option>
                    <option value="art">Art</option>
                </select>
            </div>

            <!-- SUBJECTS -->
            <div class="form-group">
                <label>Choose Your 4 JAMB Subjects</label>
                <div id="subjects-container"></div>
            </div>

            <!-- START QUIZ -->
            <button id="start-quiz">Start Quiz</button>

            <!-- ERROR -->
            <p id="error-message"></p>

            <!-- BACK TO DASHBOARD LINK -->
            <div id="back-to-dashboard-container" class="back-dashboard-container hidden">
                <a href="dashboard.html" class="back-dashboard-link">← Back to Dashboard</a>
            </div>

        </div>
    </div>

    <script src="script/script.js"></script>

    <!-- Reveal Back to Dashboard link for logged-in students -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        const loggedInStudent = localStorage.getItem("loggedInStudent");
        if (loggedInStudent) {
          const backContainer = document.getElementById("back-to-dashboard-container");
          if (backContainer) {
            backContainer.classList.remove("hidden");
          }
        }
      });
    </script>

</body>

</html>

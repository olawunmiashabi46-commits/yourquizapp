<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Educator Sign Up | JAMB Quiz</title>

    <link
        rel="stylesheet"
        href="style/register.css"
    >

    <style>
        .subject-checks {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 6px;
        }
        .subject-check {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .subject-check input { width: 18px; height: 18px; margin: 0; flex-shrink: 0; }
        .subject-check:has(input:checked) { border-color: #2563eb; background: #eff6ff; }
        .subject-checks.has-error { outline: 2px solid #dc2626; outline-offset: 3px; border-radius: 10px; }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <h1>
                <i data-lucide="graduation-cap"></i>
                JAMB QUIZ
            </h1>

            <p class="subtitle">
                Create your educator account
            </p>


            <!-- FULL NAME -->
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" placeholder="Enter your full name">
                <p class="field-error" id="full-name-error"></p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" autocapitalize="none" placeholder="Enter your email">
                <p class="field-error" id="email-error"></p>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g. 08012345678">
                <p class="field-error" id="phone-error"></p>
            </div>

            <div class="form-group">
                <label>Subjects you teach <span style="font-weight:normal; color:#64748b;">(tick all that apply)</span></label>
                <div class="subject-checks" id="subjects">
                    <label class="subject-check"><input type="checkbox" name="subject" value="Use of English"><span>Use of English</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Mathematics"><span>Mathematics</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Physics"><span>Physics</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Chemistry"><span>Chemistry</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Biology"><span>Biology</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Agricultural Science"><span>Agricultural Science</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Economics"><span>Economics</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Accounting"><span>Accounting</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Commerce"><span>Commerce</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Government"><span>Government</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Literature in English"><span>Literature in English</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="History"><span>History</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="CRS"><span>CRS</span></label>
                    <label class="subject-check"><input type="checkbox" name="subject" value="Geography"><span>Geography</span></label>
                </div>
                <p class="field-error" id="subjects-error"></p>
            </div>

            <div class="form-group">
                <label for="bio">Short bio</label>
                <textarea id="bio" placeholder="Tell students a little about you"></textarea>
            </div>

            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                    />

                    <button
                        type="button"
                        id="toggle-password"
                        class="toggle-password-btn"
                        aria-label="Show or hide password"
                    >
                        <i data-lucide="eye"></i>
                    </button>

                </div>
                <p class="field-error" id="password-error"></p>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                    />

                    <button
                        type="button"
                        id="toggle-confirm-password"
                        class="toggle-password-btn"
                        aria-label="Show or hide confirm password"
                    >
                        <i data-lucide="eye"></i>
                    </button>

                </div>
                <p class="field-error" id="confirm-password-error"></p>

            </div>


            <!-- REGISTER -->

            <button id="register-button">
                Create Account
            </button>


            <!-- ERROR -->

            <p id="error-message"></p>


            <p class="switch-link">Are you a student? <a href="register.html">Register as a Student</a></p>

            <!-- LOGIN -->

            <p class="account-link">

                Already have an account?

                <button id="login-button">
                    Login
                </button>

            </p>

        </div>

    </div>


    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

    <script
        type="module"
        src="script/register-educator.js"
    ></script>

</body>

</html>

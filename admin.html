<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >
    <title>Admin Dashboard | JAMB Quiz</title>
    <link rel="stylesheet" href="style/dashboard.css">
    <style>
        .home-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            height: 48px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            color: #1e3a8a;
            transition: all 0.2s ease;
        }
        .home-link:hover {
            background: #eff6ff;
            border-color: #1e3a8a;
            transform: translateY(-1px);
        }
        .home-link i { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <div class="dashboard-container">

        <!-- HEADER -->
        <div class="dashboard-header">
            <div>
                <h1>JAMB QUIZ</h1>
                <p>Welcome, Admin!</p>
            </div>
        </div>

        <!-- DASHBOARD CONTENT -->
        <div class="dashboard-content">
            <div class="dashboard-card">

                <h2>
                    <i data-lucide="shield-check"></i>
                    Admin Dashboard
                </h2>

                <p>
                    Manage questions, championships, reviews and lessons from here.
                </p>

                <div class="dashboard-actions">

                    <button id="questions-button">
                        <i data-lucide="file-plus"></i>
                        <span>Add Questions</span>
                    </button>

                    <button id="championship-button">
                        <i data-lucide="trophy"></i>
                        <span>Manage Championships</span>
                    </button>

                    <button id="reports-button">
                        <i data-lucide="flag"></i>
                        <span>Review Reports</span>
                    </button>

                    <button id="lessons-button">
                        <i data-lucide="video"></i>
                        <span>Lesson Approvals</span>
                    </button>

                    <button id="qreview-button">
                        <i data-lucide="clipboard-check"></i>
                        <span>Question Reviews</span>
                    </button>

                    <button id="bulk-button">
                        <i data-lucide="file-spreadsheet"></i>
                        <span>Bulk Import Questions</span>
                    </button>

                </div>

                <div class="logout-section">
                    <a href="dashboard.html" class="home-link">
                        <i data-lucide="arrow-left"></i>
                        Back Home
                    </a>
                </div>

            </div>
        </div>

        <!-- FOOTER -->
        <footer>
            <p>JAMB Quiz App © 2026</p>
        </footer>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();

        // Only the signed-in admin may see this page.
        if (sessionStorage.getItem('adminAuthenticated') !== 'true') {
            window.location.href = 'admin-login.html';
        }

        const go = (id, url) =>
            document.getElementById(id).addEventListener('click', () => { window.location.href = url; });

        go('questions-button', 'admin-questions.html');
        go('championship-button', 'admin-championship.html');
        go('reports-button', 'admin-reports.html');
        go('lessons-button', 'admin-lessons.html');
        go('bulk-button', 'admin-bulk.html');
        go('qreview-button', 'admin-question-review.html');
    </script>
</body>
</html>

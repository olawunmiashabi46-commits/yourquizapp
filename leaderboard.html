<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Leaderboard</title>

    <link
        rel="stylesheet"
        href="style/leaderboard.css"
    >

</head>

<body>

    <div class="leaderboard-container">


        <!-- HEADER -->

        <div class="leaderboard-header">

            <h1>

                <i data-lucide="trophy"></i>

                Leaderboard

            </h1>

            <p>
                Each quiz session is ranked on its own, newest first.
            </p>

        </div>


        <!-- LEADERBOARD SESSIONS (one card per quiz session) -->
        <div id="leaderboard-container">
            <div class="leaderboard-message">Loading rankings...</div>
        </div>

        <!-- BACK BUTTON -->

        <button id="back-button">

            <i data-lucide="arrow-left"></i>

            Back to Dashboard

        </button>

    </div>


    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>


    <!-- Script -->

    <script
        type="module"
        src="script/leaderboard.js"
    ></script>

</body>

</html>

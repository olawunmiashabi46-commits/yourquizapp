<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Manage Championships | Admin</title>
<link rel="stylesheet" href="style/admin-championship.css">
<link rel="stylesheet" href="style/championship-shared.css">
</head>
<body>
<div class="create-container">
  <div class="create-card">
    <div class="create-icon"><i data-lucide="trophy"></i></div>
    <h1>Create a Championship</h1>
    <p class="description">
        One general event. Every student answers English, plus one other subject
        they choose for themselves when they register.
    </p>

    <div class="form-group">
        <label for="champ-title">Championship Title</label>
        <input type="text" id="champ-title" placeholder="Example: December JAMB Championship" maxlength="60">
    </div>

    <div class="form-group">
        <label for="champ-eligible">Who can enter</label>
        <select id="champ-eligible">
            <option value="premium">Premium members only (no extra fee)</option>
            <option value="free">Free plan — pay ₦2,000 to enter</option>
        </select>
    </div>

    <div class="form-group">
        <label for="champ-reg-opens">Registration Opens</label>
        <input type="datetime-local" id="champ-reg-opens">
    </div>

    <div class="form-group">
        <label for="champ-reg-closes">Registration Closes</label>
        <input type="datetime-local" id="champ-reg-closes">
    </div>

    <div class="form-group">
        <label for="champ-date">Date &amp; Time it starts</label>
        <input type="datetime-local" id="champ-date">
    </div>

    <div class="form-group">
        <label for="champ-duration">Time Limit (minutes)</label>
        <input type="number" id="champ-duration" value="60" min="10" max="180">
    </div>

    <div class="form-group">
        <label for="champ-prize">Prize Info (shown to students)</label>
        <textarea id="champ-prize" placeholder="Example: Winner gets ₦20,000. Top 5 get certificates."></textarea>
    </div>

    <button id="create-button" class="app-button primary"><i data-lucide="trophy"></i> Create Championship</button>
    <p id="error-message" style="color:#dc2626; font-size:14px; margin-top:10px;"></p>

    <div class="champ-list" id="champ-list"></div>

    <a href="admin.html" style="display:block; text-align:center; margin-top:18px; color:#64748b; font-size:14px;">← Back to Admin Dashboard</a>
  </div>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script type="module" src="script/admin-championship.js"></script>
<script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>

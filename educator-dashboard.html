<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Educator Dashboard | JAMB Quiz</title>
<style>
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8fafc;color:#1e293b;display:flex;justify-content:center;padding:24px}
.box{max-width:480px;width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:30px;text-align:center}
h1{font-size:22px;margin-bottom:8px}p{color:#64748b;font-size:14px;margin-bottom:8px}
.badge{display:inline-block;background:#e0f2fe;color:#0369a1;border-radius:20px;padding:4px 12px;font-size:13px;margin:8px 0 16px}
button{padding:12px 22px;border:none;border-radius:10px;background:#0f172a;color:#fff;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <h1 id="welcome">Welcome</h1>
  <span class="badge" id="plan">Free plan</span>
  <p>Your educator account is ready. Video uploads, student questions and live classes are coming soon.</p>
  <button id="logout">Logout</button>
</div>
<script type="module">
import { supabase } from './script/supabase.js';
const { data } = await supabase.auth.getSession();
const e = JSON.parse(localStorage.getItem('loggedInEducator') || 'null');
if (!data.session || !e) { window.location.href = 'login.html'; }
else {
  document.getElementById('welcome').textContent = 'Welcome, ' + e.name + '!';
  document.getElementById('plan').textContent = (e.plan === 'premium' ? 'Premium' : 'Free') + ' plan';
}
document.getElementById('logout').onclick = async () => {
  await supabase.auth.signOut();
  localStorage.removeItem('loggedInEducator');
  window.location.href = 'login.html';
};
</script>
</body>
</html>

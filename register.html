<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Create Account | JAMB Quiz</title>

    <link
        rel="stylesheet"
        href="style/register.css"
    >

</head>

<body>

    <div class="register-container">

        <div class="register-box">

            <h1>
                <i data-lucide="graduation-cap"></i>
                JAMB QUIZ
            </h1>

            <p class="subtitle">
                Create your student account
            </p>


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="full-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full-name"
                    placeholder="Enter your full name"
                >
                <p class="field-error" id="full-name-error"></p>

            </div>


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Create a username"
                >
                <p class="field-error" id="username-error"></p>

            </div>


            
            <!-- EMAIL -->
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" autocapitalize="none" placeholder="Enter your email">
                <p class="field-error" id="email-error"></p>
            </div>

            <!-- PHONE -->
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g. 08012345678">
                <p class="field-error" id="phone-error"></p>
            </div>

            <!-- EXAM TYPE -->
            <div class="form-group">
                <label for="exam-type">I am preparing for</label>
                <select id="exam-type">
                    <option value="JAMB">JAMB</option>
                    <option value="Post-UTME">Post-UTME</option>
                    <option value="Both">Both</option>
                </select>
            </div>

            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                    />

                    <button
                        type="button"
                        id="toggle-password"
                        class="toggle-password-btn"
                        aria-label="Show or hide password"
                    >
                        <i data-lucide="eye"></i>
                    </button>

                </div>
                <p class="field-error" id="password-error"></p>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                    />

                    <button
                        type="button"
                        id="toggle-confirm-password"
                        class="toggle-password-btn"
                        aria-label="Show or hide confirm password"
                    >
                        <i data-lucide="eye"></i>
                    </button>

                </div>
                <p class="field-error" id="confirm-password-error"></p>

            </div>


            <!-- REGISTER -->

            <button id="register-button">
                Create Account
            </button>


            <!-- ERROR -->

            <p id="error-message"></p>


            <p class="switch-link">Are you a teacher? <a href="register-educator.html">Register as an Educator</a></p>

            <!-- LOGIN -->

            <p class="account-link">

                Already have an account?

                <button id="login-button">
                    Login
                </button>

            </p>

        </div>

    </div>


    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

    <script
        type="module"
        src="script/register.js"
    ></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Group Chat | JAMB Quiz</title>
<link rel="stylesheet" href="style/chat.css">
</head>
<body>

<div class="chat-header">
  <a href="chat-rooms.html"><i data-lucide="arrow-left"></i></a>
  <i data-lucide="users"></i>
  <h1 id="room-title">Group Chat</h1>
</div>

<div id="locked-screen" class="locked-screen" style="display:none;">
  <i data-lucide="lock" style="width:32px; height:32px; color:#94a3b8;"></i>
  <p style="color:#475569; font-size:15px;">Group chat is a Premium feature.</p>
  <a href="upgrade.html">Upgrade to join →</a>
</div>

<div id="pinned-bar" class="pinned-bar" style="display:none;"></div>

<div id="chat-messages" class="chat-messages"></div>

<div id="recording-indicator" class="recording-indicator" style="display:none;">
  <i data-lucide="mic" style="width:16px; height:16px;"></i>
  <span id="recording-time">Recording... 0:00</span>
</div>

<div id="chat-input-bar" class="chat-input-bar" style="display:none;">
  <textarea id="message-input" placeholder="Type a message..." rows="1" maxlength="1000"></textarea>
  <button id="mic-button" class="mic-button" title="Hold to record a voice note"><i data-lucide="mic"></i></button>
  <button id="send-button"><i data-lucide="send"></i></button>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script>if (window.lucide) lucide.createIcons();</script>
<script type="module" src="script/chat.js"></script>
</body>
</html>

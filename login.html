<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>JAMB Quiz Login</title>

    <link
        rel="stylesheet"
        href="style/login.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>
                <i data-lucide="graduation-cap"></i>
                JAMB QUIZ
            </h1>

            <p class="subtitle">
                Login to continue your quiz
            </p>


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="username"
                    autocapitalize="none"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Enter username or email"
                >
                <p class="field-error" id="username-error"></p>

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    />

                    <button
                        type="button"
                        id="toggle-password"
                        class="toggle-password-btn"
                        aria-label="Show or hide password"
                    >
                        <i data-lucide="eye"></i>
                    </button>

                </div>
                <p class="field-error" id="password-error"></p>

            </div>


            <!-- Login Button -->

            <button id="login-button">
                Login
            </button>


                        <!-- One-time upgrade for old accounts -->
            <div id="upgrade-panel" style="display:none; margin-top:10px;">
                <p style="font-size:14px; color:#334155; margin-bottom:12px;">
                    Good news, your account was found! We've made logins more secure.
                    Please add your email and phone number once to continue.
                </p>
                <div class="form-group">
                    <label for="upgrade-email">Email</label>
                    <input type="email" id="upgrade-email" autocapitalize="none" placeholder="Enter your email">
                    <p class="field-error" id="upgrade-email-error"></p>
                </div>
                <div class="form-group">
                    <label for="upgrade-phone">Phone Number</label>
                    <input type="tel" id="upgrade-phone" placeholder="e.g. 08012345678">
                    <p class="field-error" id="upgrade-phone-error"></p>
                </div>
                <button id="upgrade-button" style="width:100%; padding:14px; border:none; border-radius:10px; background:#2563eb; color:#fff; font-size:16px; font-weight:bold; cursor:pointer;">Upgrade my account</button>
            </div>

            <!-- Error -->

            <p id="error-message"></p>


            <!-- Create Account -->

            <p class="account-link">

                Don't have an account?

                <button id="create-account-button">
                    Create Account
                </button>

            </p>

        </div>

    </div>


    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

    <script
        type="module"
        src="script/login.js"
    ></script>

</body>

</html>

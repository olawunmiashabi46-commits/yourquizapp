<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>JAMB Quiz Login</title>

    <link
        rel="stylesheet"
        href="style/login.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>
                <i data-lucide="graduation-cap"></i>
                JAMB QUIZ
            </h1>

            <p class="subtitle">
                Login to continue your quiz
            </p>


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    autocapitalize="none"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Enter Username"
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                    />

                    <button
                        type="button"
                        id="toggle-password"
                        class="toggle-password-btn"
                        aria-label="Show or hide password"
                    >
                        <i data-lucide="eye"></i>
                    </button>

                </div>

            </div>


            <!-- Login Button -->

            <button id="login-button">
                Login
            </button>


            <!-- Error -->

            <p id="error-message"></p>


            <!-- Create Account -->

            <p class="account-link">

                Don't have an account?

                <button id="create-account-button">
                    Create Account
                </button>

            </p>

        </div>

    </div>


    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

    <script
        type="module"
        src="script/login.js"
    ></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Student Dashboard</title>

    <link
        rel="stylesheet"
        href="style/dashboard.css"
    >

<style>
.champ-banner {
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 12px;
    cursor: pointer;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-left: 5px solid #cbd5e1;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    transition: all 0.2s ease;
}
.champ-banner:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(15, 23, 42, 0.1);
}
.champ-banner-premium { border-left-color: #2563eb; }
.champ-banner-free { border-left-color: #d97706; }
.champ-banner-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.03em;
    margin-bottom: 6px;
}
.champ-banner-premium .champ-banner-label { color: #2563eb; }
.champ-banner-free .champ-banner-label { color: #d97706; }
.champ-banner-label i { width: 14px; height: 14px; }
.champ-banner-title { font-size: 17px; font-weight: bold; color: #0f172a; }
.champ-banner-sub { font-size: 13px; color: #64748b; margin-top: 4px; }
</style>
</head>

<body>

    <div class="dashboard-container">

        <!-- HEADER -->

        <div class="dashboard-header">

            <div>

                <h1>JAMB QUIZ</h1>

                <!-- PREMIUM CHAMPIONSHIP BANNER -->
                <div id="champ-banner-premium" class="champ-banner champ-banner-premium" style="display:none;">
                    <div class="champ-banner-label"><i data-lucide="trophy"></i> Premium Championship</div>
                    <div class="champ-banner-title" id="champ-banner-premium-title"></div>
                    <div class="champ-banner-sub" id="champ-banner-premium-sub"></div>
                </div>

                <!-- FREE CHAMPIONSHIP BANNER -->
                <div id="champ-banner-free" class="champ-banner champ-banner-free" style="display:none;">
                    <div class="champ-banner-label"><i data-lucide="trophy"></i> Free Championship — ₦2,000 to enter</div>
                    <div class="champ-banner-title" id="champ-banner-free-title"></div>
                    <div class="champ-banner-sub" id="champ-banner-free-sub"></div>
                </div>

                <p id="welcome-message">
                    Welcome, Student!
                </p>

            </div>

        </div>


        <!-- DASHBOARD CONTENT -->

        <div class="dashboard-content">

            <div class="dashboard-card">

                <h2>
                    <i data-lucide="graduation-cap"></i>
                    Student Dashboard
                </h2>

                <p>
                    Welcome to your quiz dashboard. Choose an option below to continue.
                </p>


                <!-- MAIN BUTTONS GRID -->

                <div class="dashboard-actions">

                    <!-- START QUIZ -->

                    <button id="start-quiz-button">

                        <i data-lucide="clipboard-list"></i>

                        <span>
                            Start Quiz
                        </span>

                    </button>


                    <!-- VIEW RESULTS -->

                    <button id="results-button">

                        <i data-lucide="chart-column"></i>

                        <span>
                            View Results
                        </span>

                    </button>


                    <!-- MY PROGRESS -->

                    <button id="progress-button">

                        <i data-lucide="trending-up"></i>

                        <span>
                            My Progress
                        </span>

                    </button>


                    <!-- UPGRADE TO PREMIUM -->

                    <button id="upgrade-button">

                        <i data-lucide="star"></i>

                        <span>
                            Go Premium
                        </span>

                    </button>


                    <!-- GROUP CHAT (Premium only, hidden entirely for Free students) -->

                    <button id="group-chat-button" style="display:none;">

                        <i data-lucide="users"></i>

                        <span>
                            Group Chat
                        </span>

                    </button>


                    <!-- LEADERBOARD -->

                    <button id="leaderboard-button">

                        <i data-lucide="trophy"></i>

                        <span>
                            Leaderboard
                        </span>

                    </button>


                    <!-- JOIN QUIZ -->

                    <button id="join-quiz-button">

                        <i data-lucide="gamepad-2"></i>

                        <span>
                            Join Quiz
                        </span>

                    </button>


                    <!-- CREATE QUIZ -->

                    <button id="create-quiz-button">

                        <i data-lucide="target"></i>

                        <span>
                            Create Quiz
                        </span>

                    </button>

                    <!-- ADMIN LOGIN -->

                    <button id="admin-login-button">

                        <i data-lucide="shield-check"></i>

                        <span>
                            Admin Login
                        </span>

                    </button>

                </div>


                <!-- LOGOUT -->

                <div class="logout-section">

                    <button id="logout-button">

                        <i data-lucide="log-out"></i>

                        Logout

                    </button>

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <footer>

            <p>
                JAMB Quiz App © 2026
            </p>

        </footer>

    </div>


    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

    <script
        src="script/dashboard.js"
    ></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Student Dashboard</title>

    <link
        rel="stylesheet"
        href="style/dashboard.css"
    >

</head>

<body>

    <div class="dashboard-container">

        <!-- HEADER -->

        <div class="dashboard-header">

            <div>

                <h1>JAMB QUIZ</h1>

                <!-- PREMIUM CHAMPIONSHIP BANNER -->
                <div id="champ-banner-premium" style="display:none; background:linear-gradient(135deg,#1e3a8a,#2563eb); color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:12px; cursor:pointer;">
                    <div style="font-size:13px; opacity:.85; margin-bottom:4px;">⭐ Premium Championship</div>
                    <div style="font-size:16px; font-weight:bold;" id="champ-banner-premium-title"></div>
                    <div style="font-size:13px; opacity:.9; margin-top:4px;" id="champ-banner-premium-sub"></div>
                </div>

                <!-- FREE CHAMPIONSHIP BANNER -->
                <div id="champ-banner-free" style="display:none; background:linear-gradient(135deg,#b45309,#d97706); color:#fff; border-radius:14px; padding:16px 18px; margin-bottom:18px; cursor:pointer;">
                    <div style="font-size:13px; opacity:.9; margin-bottom:4px;">🎟️ Free Championship — ₦2,000 to enter</div>
                    <div style="font-size:16px; font-weight:bold;" id="champ-banner-free-title"></div>
                    <div style="font-size:13px; opacity:.95; margin-top:4px;" id="champ-banner-free-sub"></div>
                </div>

                <p id="welcome-message">
                    Welcome, Student!
                </p>

            </div>

        </div>


        <!-- DASHBOARD CONTENT -->

        <div class="dashboard-content">

            <div class="dashboard-card">

                <h2>
                    <i data-lucide="graduation-cap"></i>
                    Student Dashboard
                </h2>

                <p>
                    Welcome to your quiz dashboard. Choose an option below to continue.
                </p>


                <!-- MAIN BUTTONS GRID -->

                <div class="dashboard-actions">

                    <!-- START QUIZ -->

                    <button id="start-quiz-button">

                        <i data-lucide="clipboard-list"></i>

                        <span>
                            Start Quiz
                        </span>

                    </button>


                    <!-- VIEW RESULTS -->

                    <button id="results-button">

                        <i data-lucide="chart-column"></i>

                        <span>
                            View Results
                        </span>

                    </button>


                    <!-- UPGRADE TO PREMIUM -->

                    <button id="upgrade-button" style="background:linear-gradient(135deg,#2563eb,#1d4ed8); color:#fff;">

                        <i data-lucide="star"></i>

                        <span>
                            Go Premium
                        </span>

                    </button>


                    <!-- LEADERBOARD -->

                    <button id="leaderboard-button">

                        <i data-lucide="trophy"></i>

                        <span>
                            Leaderboard
                        </span>

                    </button>


                    <!-- JOIN QUIZ -->

                    <button id="join-quiz-button">

                        <i data-lucide="gamepad-2"></i>

                        <span>
                            Join Quiz
                        </span>

                    </button>


                    <!-- CREATE QUIZ -->

                    <button id="create-quiz-button">

                        <i data-lucide="target"></i>

                        <span>
                            Create Quiz
                        </span>

                    </button>

                    <!-- ADMIN LOGIN -->

                    <button id="admin-login-button">

                        <i data-lucide="shield-check"></i>

                        <span>
                            Admin Login
                        </span>

                    </button>

                </div>


                <!-- LOGOUT -->

                <div class="logout-section">

                    <button id="logout-button">

                        <i data-lucide="log-out"></i>

                        Logout

                    </button>

                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <footer>

            <p>
                JAMB Quiz App © 2026
            </p>

        </footer>

    </div>


    <!-- Lucide Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        lucide.createIcons();
    </script>

    <script
        src="script/dashboard.js"
    ></script>

</body>

</html>
